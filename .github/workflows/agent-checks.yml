name: Catholic agent checks
on:
  pull_request:
  push:
    branches: [feat/catholic-research-agent]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:agent
      - run: node --check server.js && node --check agent-ui.js && node --check children-guides.js
      - run: npm run build
