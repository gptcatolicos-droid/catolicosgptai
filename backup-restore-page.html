<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Restaurar Backup · CatólicosGPT</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f7f3ed;color:#3b2415;margin:0;padding:40px}
    .card{max-width:760px;margin:auto;background:#fff;border:1px solid #e6dfd4;border-radius:18px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
    h1{color:#6d1922}.warn{background:#fff5e5;border:1px solid #d8ad58;padding:14px;border-radius:10px;margin:18px 0}
    button{background:#6d1922;color:white;border:0;border-radius:10px;padding:13px 20px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}
    input{display:block;margin:20px 0;width:100%}pre{white-space:pre-wrap;background:#f5f5f5;padding:15px;border-radius:10px;max-height:360px;overflow:auto}
  </style>
</head>
<body>
  <div class="card">
    <h1>Restaurar backup completo</h1>
    <p>Selecciona el JSON de backup de CatólicosGPT. El sistema valida los conteos y hace merge: no borra contenido actual.</p>
    <div class="warn"><strong>Validación mínima:</strong> 40 infografías, 2.000 contenidos de Fe Católica, 5 PDFs y 300 santos.</div>
    <input id="file" type="file" accept="application/json,.json">
    <button id="go">Validar y restaurar</button>
    <pre id="out">Esperando archivo…</pre>
  </div>
  <script>
    const fileInput=document.getElementById('file');
    const output=document.getElementById('out');
    const button=document.getElementById('go');
    button.addEventListener('click',async()=>{
      if(!fileInput.files[0]){output.textContent='Selecciona el backup JSON.';return;}
      button.disabled=true;output.textContent='Leyendo, validando y enviando backup…';
      try{
        const text=await fileInput.files[0].text();
        JSON.parse(text);
        const response=await fetch('/admin/restaurar-backup',{method:'POST',headers:{'Content-Type':'application/json'},body:text});
        const raw=await response.text();
        let value;try{value=JSON.parse(raw)}catch(_){value={ok:false,response:raw}}
        output.textContent=JSON.stringify(value,null,2);
        if(!response.ok) throw new Error(value.error||('Error HTTP '+response.status));
      }catch(error){output.textContent+='\n\nERROR: '+error.message;}
      finally{button.disabled=false;}
    });
  </script>
</body>
</html>
